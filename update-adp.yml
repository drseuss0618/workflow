name: Update ADP Rankings

on:
  schedule:
    # Runs daily at 9am UTC. During peak draft season (May–Aug) you may
    # want to increase frequency — e.g. every 6 hours: "0 */6 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  update-adp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest ADP
        env:
          SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
        run: node fetch-adp.js

      - name: Commit updated data
        run: |
          git config user.name "adp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rankings.json
          git diff --staged --quiet || git commit -m "Update ADP rankings"
          git push
